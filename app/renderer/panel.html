<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pocket — Output</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 480px;
      height: 600px;
      background: transparent;
      overflow: hidden;
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    #panel {
      width: 100%;
      height: 100%;
      background: rgba(14, 14, 20, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow:
        0 24px 64px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.04) inset;
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    #title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #title-icon {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #5D9E6E;
      box-shadow: 0 0 8px #5D9E6E;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    #title-text {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
    }

    #content-type-badge {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.06);
      padding: 2px 8px;
      border-radius: 99px;
      text-transform: uppercase;
    }

    #close-btn {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }

    #close-btn:hover {
      background: rgba(220, 80, 80, 0.25);
      color: rgba(255,255,255,0.8);
    }

    /* ── Content area ── */
    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    #content-area::-webkit-scrollbar { width: 4px; }
    #content-area::-webkit-scrollbar-track { background: transparent; }
    #content-area::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
    }

    /* ── Text content ── */
    .content-text {
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255,255,255,0.82);
    }

    /* ── Code content ── */
    .content-code {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 12.5px;
      line-height: 1.65;
      color: #E8E8E8;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      white-space: pre;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }

    /* Simple syntax tinting for code */
    .content-code .kw  { color: #C792EA; }
    .content-code .str { color: #C3E88D; }
    .content-code .num { color: #F78C6C; }
    .content-code .cmt { color: #546E7A; font-style: italic; }

    /* ── Markdown-ish rendering ── */
    .md-h1, .md-h2, .md-h3 {
      font-weight: 600;
      color: rgba(255,255,255,0.92);
      margin: 16px 0 8px;
    }
    .md-h1 { font-size: 18px; }
    .md-h2 { font-size: 16px; }
    .md-h3 { font-size: 14px; color: rgba(255,255,255,0.7); }

    .md-p   { font-size: 13.5px; line-height: 1.7; color: rgba(255,255,255,0.78); margin-bottom: 10px; }
    .md-li  { font-size: 13.5px; line-height: 1.7; color: rgba(255,255,255,0.78); margin: 4px 0 4px 18px; }
    .md-hr  { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 16px 0; }
    .md-code-inline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: rgba(255,255,255,0.08);
      padding: 1px 5px;
      border-radius: 4px;
      color: #C3E88D;
    }

    /* ── Footer ── */
    #footer {
      padding: 10px 18px;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    #footer-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.2);
    }

    #copy-btn {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }

    #copy-btn:hover {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
    }

    #copy-btn.copied {
      color: #5D9E6E;
      border-color: #5D9E6E;
    }
  </style>
</head>
<body>

<div id="panel">
  <div id="header">
    <div id="title">
      <div id="title-icon"></div>
      <span id="title-text">Pocket</span>
      <span id="content-type-badge">output</span>
    </div>
    <button id="close-btn" title="Close (Alt+P)">✕</button>
  </div>

  <div id="content-area">
    <div id="content-body" class="content-text">
      Waiting for Pocket...
    </div>
  </div>

  <div id="footer">
    <span id="footer-hint">Alt+P to toggle</span>
    <button id="copy-btn">Copy</button>
  </div>
</div>

<script>
const contentBody = document.getElementById('content-body');
const badge       = document.getElementById('content-type-badge');
const titleText   = document.getElementById('title-text');
const copyBtn     = document.getElementById('copy-btn');
const closeBtn    = document.getElementById('close-btn');

let rawContent = '';

// ── Render content ────────────────────────────────────────────────────────────
function renderContent({ content, contentType, title }) {
  rawContent = content;
  titleText.textContent = title || 'Pocket';
  badge.textContent = contentType || 'text';

  if (contentType === 'code') {
    contentBody.className = 'content-code';
    contentBody.textContent = content;
  } else if (contentType === 'markdown' || contentType === 'text') {
    contentBody.className = '';
    contentBody.innerHTML = renderMarkdown(content);
  } else {
    contentBody.className = 'content-text';
    contentBody.textContent = content;
  }

  // Scroll to top on new content
  document.getElementById('content-area').scrollTop = 0;
}

// ── Simple markdown renderer ──────────────────────────────────────────────────
function renderMarkdown(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.+)$/gm, '<div class="md-h3">$1</div>')
    .replace(/^## (.+)$/gm,  '<div class="md-h2">$1</div>')
    .replace(/^# (.+)$/gm,   '<div class="md-h1">$1</div>')
    .replace(/^---$/gm,      '<hr class="md-hr">')
    .replace(/`([^`]+)`/g,   '<span class="md-code-inline">$1</span>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,     '<em>$1</em>')
    .replace(/^[*\-] (.+)$/gm, '<div class="md-li">• $1</div>')
    .replace(/\n\n/g, '</div><div class="md-p">')
    .replace(/^(?!<)/gm,     '')
    .split('\n').map(l => l.match(/^</) ? l : `<div class="md-p">${l}</div>`).join('');
}

// ── Copy button ───────────────────────────────────────────────────────────────
copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(rawContent).then(() => {
    copyBtn.textContent = 'Copied!';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copy';
      copyBtn.classList.remove('copied');
    }, 1800);
  });
});

// ── Close button ──────────────────────────────────────────────────────────────
closeBtn.addEventListener('click', () => {
  if (window.pocket) window.pocket.closePanel();
});

// ── IPC from main ─────────────────────────────────────────────────────────────
if (window.pocket) {
  window.pocket.onContent((data) => renderContent(data));
}

console.log('[Pocket] Output panel ready');
</script>

</body>
</html>
